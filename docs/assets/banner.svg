<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Panel MCP: let AI assistants run your Pterodactyl servers, as you">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset=".55" stop-color="#121027"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow1)"/>
  <rect width="1280" height="420" fill="url(#glow2)"/>

  <!-- logo -->
  <g transform="translate(88 118) scale(.72)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
    <g fill="#0b0b14" fill-opacity=".9"><rect x="58" y="62" width="104" height="36" rx="10"/><rect x="58" y="110" width="104" height="36" rx="10"/><rect x="58" y="158" width="104" height="36" rx="10"/></g>
    <g fill="#34d399"><circle cx="78" cy="80" r="6"/><circle cx="78" cy="128" r="6"/><circle cx="78" cy="176" r="6"/></g>
    <g stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"><line x1="98" y1="80" x2="140" y2="80"/><line x1="98" y1="128" x2="132" y2="128"/><line x1="98" y1="176" x2="144" y2="176"/></g>
    <path d="M162 128 H184" stroke="#0b0b14" stroke-width="10" stroke-linecap="round"/>
    <circle cx="198" cy="128" r="22" fill="#0b0b14"/>
    <path d="M190 116 l10 12 -10 12 M201 116 l10 12 -10 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="300" y="186" font-size="78" font-weight="800" fill="#fafafa" letter-spacing="-2">Panel <tspan fill="url(#accent)">MCP</tspan></text>
    <text x="304" y="238" font-size="27" fill="#c4c4d4">Let AI assistants run your Pterodactyl servers, as you.</text>
    <g font-size="17" font-weight="600" fill="#e4e4f0">
      <g transform="translate(304 270)"><rect width="178" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="89" y="25" text-anchor="middle">OAuth 2.1 + PKCE</text></g>
      <g transform="translate(494 270)"><rect width="112" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="56" y="25" text-anchor="middle">33 tools</text></g>
      <g transform="translate(618 270)"><rect width="206" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="103" y="25" text-anchor="middle">Your permissions only</text></g>
      <g transform="translate(836 270)"><rect width="190" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="95" y="25" text-anchor="middle">Every action logged</text></g>
    </g>
    <text x="304" y="350" font-size="16" fill="#8b8ba3">A Pterodactyl Panel v2 extension · Claude · ChatGPT · Cursor · any MCP client</text>
  </g>

  <!-- console snippet -->
  <g transform="translate(1058 92)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5">
    <rect width="200" height="236" rx="14" fill="#0e0e18" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="18" cy="18" r="4.5" fill="#f87171"/><circle cx="34" cy="18" r="4.5" fill="#fbbf24"/><circle cx="50" cy="18" r="4.5" fill="#34d399"/>
    <text x="16" y="52" fill="#a78bfa">▸ list_servers</text>
    <text x="30" y="74" fill="#8b8ba3">survival  running</text>
    <text x="30" y="94" fill="#8b8ba3">lobby     running</text>
    <text x="16" y="122" fill="#a78bfa">▸ get_console</text>
    <text x="30" y="144" fill="#8b8ba3">TPS 19.9 · 41 online</text>
    <text x="16" y="172" fill="#22d3ee">▸ edit_file</text>
    <text x="30" y="194" fill="#8b8ba3">config.yml  +2 −1</text>
    <text x="16" y="220" fill="#34d399">✓ logged as you</text>
  </g>
</svg>
