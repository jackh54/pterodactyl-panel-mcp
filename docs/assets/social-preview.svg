<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset=".55" stop-color="#121027"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <!-- logo -->
  <g transform="translate(548 70) scale(.72)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
    <g fill="#0b0b14" fill-opacity=".9"><rect x="58" y="62" width="104" height="36" rx="10"/><rect x="58" y="110" width="104" height="36" rx="10"/><rect x="58" y="158" width="104" height="36" rx="10"/></g>
    <g fill="#34d399"><circle cx="78" cy="80" r="6"/><circle cx="78" cy="128" r="6"/><circle cx="78" cy="176" r="6"/></g>
    <g stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"><line x1="98" y1="80" x2="140" y2="80"/><line x1="98" y1="128" x2="132" y2="128"/><line x1="98" y1="176" x2="144" y2="176"/></g>
    <path d="M162 128 H184" stroke="#0b0b14" stroke-width="10" stroke-linecap="round"/>
    <circle cx="198" cy="128" r="22" fill="#0b0b14"/>
    <path d="M190 116 l10 12 -10 12 M201 116 l10 12 -10 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>


  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="640" y="350" font-size="84" font-weight="800" fill="#fafafa" letter-spacing="-2">Panel <tspan fill="url(#accent)">MCP</tspan></text>
    <text x="640" y="406" font-size="30" fill="#c4c4d4">Let AI assistants run your Pterodactyl servers, as you.</text>
    <g font-size="18" font-weight="600" fill="#e4e4f0">
      <g transform="translate(248 448)"><rect width="190" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="95" y="28">OAuth 2.1 + PKCE</text></g>
      <g transform="translate(452 448)"><rect width="120" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="60" y="28">33 tools</text></g>
      <g transform="translate(586 448)"><rect width="222" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="111" y="28">Your permissions only</text></g>
      <g transform="translate(822 448)"><rect width="210" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="105" y="28">Every action logged</text></g>
    </g>
    <text x="640" y="566" font-size="20" fill="#8b8ba3">github.com/jackh54/pterodactyl-panel-mcp · Pterodactyl Panel v2 extension</text>
  </g>
</svg>
