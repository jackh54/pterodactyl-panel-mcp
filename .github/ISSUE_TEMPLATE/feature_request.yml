name: Feature request
description: A new tool, setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What job should an AI client be able to do?
      description: Describe the task in plain words, e.g. "find which plugin is spamming warnings in the console and disable it".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A new tool, a change to an existing one, a setting... Mention which panel permission it should need.
